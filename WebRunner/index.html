<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner - Procedural 3D Infinite Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            z-index: 100;
        }
        
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        #distance {
            font-size: 18px;
        }
        
        #speed {
            font-size: 16px;
            margin-top: 10px;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        h1 {
            color: #0ff;
            font-size: 48px;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 20px;
        }
        
        .subtitle {
            color: #f0f;
            font-size: 18px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #f0f;
        }
        
        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-shadow: 0 0 10px #0ff;
            box-shadow: 0 0 10px #0ff;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #0ff;
            color: #000;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 14px;
            z-index: 100;
        }
        
        #finalScore {
            color: #0ff;
            font-size: 32px;
            margin: 20px 0;
            text-shadow: 0 0 10px #0ff;
        }
        
        .stat-label {
            color: #f0f;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="score">SCORE: <span id="scoreValue">0</span></div>
        <div id="distance">DISTANCE: <span id="distanceValue">0</span>m</div>
        <div id="speed">SPEED: <span id="speedValue">100</span>%</div>
    </div>
    
    <div id="controls">
        Controls: SPACE/W/↑ to Jump | S/↓ to Slide | A/← Left | D/→ Right
    </div>
    
    <div id="startScreen">
        <h1>MATH RUNNER</h1>
        <div class="subtitle">A Procedural 3D Infinite Runner</div>
        <button id="startButton">START RUN</button>
    </div>
    
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <div id="finalScore">Score: 0</div>
        <button id="restartButton">TRY AGAIN</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
